; ================================================================================
; 独立 MAX9814 麦克风测试固件
; ================================================================================
; 【用途】只跑 MAX9814 ADC 采集，通过串口 monitor 看数值波动，验证麦克风是否工作。
; 【接线】MAX9814 5-pin breakout：
;   GND → ESP32-S3 GND
;   VDD → ESP32-S3 3V3
;   Out → ESP32-S3 GPIO1 (ADC1_CH0)
;   GAIN → 悬空 (+50 dB)
;   AR   → 悬空 (DC-coupled, 输出 ~1.65 V)
;   VDD↔GND 之间接 100 nF 电容（建议）
; 【输出】串口 921600：
;   每 100 ms 一行：raw ADC 值、去偏值、RMS、可视化 bar
; 【依赖】无（不启 Wi-Fi、无 lib_deps，最轻量、最快编译）
; ================================================================================

[env:esp32-s3-mic-test]

platform = espressif32
board = esp32-s3-n16r8
framework = arduino

; ===== CPU / Flash =====
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; ===== 分区 =====
board_build.partitions = default_16MB.csv

; ===== PSRAM =====
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; ===== 上传 / 串口 =====
upload_speed = 460800
monitor_speed = 921600

; ===== 编译标志 =====
; 本板 USB 口实为 CH340 USB-UART 桥（lsusb: 1a86:55d3 QinHeng），
; 接到 ESP32-S3 UART0 (GPIO43/44)，WSL2 中枚举为 /dev/ttyACM0。
; 证据：lsusb 无 Espressif 303a、ROM bootloader 文本在 115200 可见、esptool 经 ttyACM0 上传。
; 必须 CDC_ON_BOOT=0：Serial = Serial0 = UART0 = CH340 = ttyACM0。
; 若 CDC_ON_BOOT=1，Serial 绑定到 USB CDC（本板未接 native USB），ttyACM0 收不到输出。
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; 无 lib_deps：只用 Arduino 自带的 analogRead / Serial
