; ================================================================================
; PlatformIO 项目配置 - ESP32-CAM (OV2640) 视觉模块 · Step 12-1
; ================================================================================
;
; 目标：Step 12-1 摄像头基础测试
;   OV2640 初始化 -> Wi-Fi -> HTTP Stream -> 浏览器看到 MJPEG
;
; 目标板：AI-Thinker ESP32-CAM（PlatformIO 内置 board id: esp32cam）
;   对应硬件：经典 ESP32-WROOM-32, 240 MHz, 4 MB Flash, 无 PSRAM
;
; 引脚布局：AI-Thinker ESP32-CAM 官方 pinmap（见 src/main.cpp 顶部）
;
; 约束：
;   - 独立 PlatformIO 项目，与 firmware/esp32/ 无任何 include 关系
;   - 不修改主工程任何文件
;   - 只做摄像头 + Wi-Fi + HTTP MJPEG
;   - 不做人物检测 / UART / 舵机 / 任何后续步骤
; ================================================================================

[env:esp32-cam]

platform = espressif32
board    = esp32cam
framework = arduino

; 4 MB Flash / 3.3 V / 40 MHz SPI flash
board_build.f_cpu     = 240000000L
board_build.f_flash   = 40000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv

; 上传：USB-UART 桥（板上的 CP2102/CH340）
upload_speed  = 460800
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

build_flags =
    -DCORE_DEBUG_LEVEL=3

; 无外部依赖：esp32-camera / esp_http_server 都是 framework 内置
; lib_deps =
