; ================================================================================
; PlatformIO 项目配置 - ESP32-S3 N16R8 语音交互系统
; ================================================================================
; 【板子】ESP32-S3 N16R8
; 【Flash】16 MB
; 【PSRAM】8 MB
; 【框架】Arduino
; ================================================================================

[env:esp32-s3-n16r8]

platform = espressif32
board = esp32-s3-n16r8
framework = arduino

; ===== CPU / Flash =====
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; ===== 分区 =====
board_build.partitions = default_16MB.csv

; ===== PSRAM =====
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; ===== 上传 / 串口 =====
upload_speed = 460800
monitor_speed = 921600

; ===== 依赖库 =====
; 当前正弦波测试不需要额外库
;
; 如以后需要完整项目，可以取消下面的注释：
;
; lib_deps =
;     bblanchon/ArduinoJson@^7.0
;     links2004/WebSockets@^2.4

; ===== 编译标志 =====
;
; FIRMWARE_MODE_WIFI:
;   开启后固件用 Wi-Fi/TCP 收发 PLAY/ACK（Step 2）；
;   关闭时走原串口路径，向后兼容。
;
; 编译 Wi-Fi 版本：
;   pio run -DFIRMWARE_MODE_WIFI
; 或使用下面的 env:esp32-s3-n16r8-wifi 别名：
;   pio run -e esp32-s3-n16r8-wifi
;
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0

; ===== Wi-Fi 变体：与上面完全一样，仅多 -DFIRMWARE_MODE_WIFI =====
;
; pre-build hook:
;   每次 pio run -e esp32-s3-n16r8-wifi 前自动运行 scripts/gen_secrets.py，
;   把项目根 config.local.json 转成 firmware/esp32/src/secrets.local.h。
;   详见 scripts/piopre.py 与 docs/firmware.md §38。
;
;   如果 pre-script 因故失败（例如未装 python），可以临时注释下面两行，
;   手动执行: python scripts/gen_secrets.py
;
[env:esp32-s3-n16r8-wifi]
extends = env:esp32-s3-n16r8

extra_scripts = pre:../../scripts/piopre.py

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFIRMWARE_MODE_WIFI

